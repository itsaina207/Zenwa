<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="200" viewBox="0 0 300 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with subtle grid -->
  <rect width="300" height="200" rx="15" fill="#F7F7F7"/>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E0E0E0" stroke-width="0.5"/>
  </pattern>
  <rect width="300" height="200" fill="url(#grid)"/>
  
  <!-- Telegram chat interface -->
  <rect x="75" y="20" width="150" height="160" rx="15" fill="white" stroke="#0066FF" stroke-width="2"/>
  <rect x="85" y="35" width="130" height="130" rx="5" fill="#F0F7FF"/>
  
  <!-- Telegram header -->
  <rect x="85" y="35" width="130" height="20" rx="5" fill="#0088cc"/>
  <text x="150" y="49" font-family="Inter, sans-serif" font-size="10" fill="white" text-anchor="middle">Zenwa Bot</text>
  
  <!-- Natural language query -->
  <rect x="105" y="65" width="110" height="15" rx="7.5" fill="#e6efff"/>
  <text x="160" y="76" font-family="Inter, sans-serif" font-size="8" fill="#333333" text-anchor="middle">Who owns token 0.0.12345?</text>
  
  <!-- AI processing indication -->
  <g>
    <circle cx="105" cy="85" r="2" fill="#0066FF">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle cx="112" cy="85" r="2" fill="#0066FF">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="119" cy="85" r="2" fill="#0066FF">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite" begin="1s"/>
    </circle>
  </g>
  
  <!-- Response with token info -->
  <rect x="90" y="95" width="120" height="60" rx="10" fill="#0066FF" fill-opacity="0.1"/>
  <text x="100" y="107" font-family="Inter, sans-serif" font-size="8" fill="#333333" font-weight="bold">Token 0.0.12345 holders:</text>
  <text x="100" y="120" font-family="Inter, sans-serif" font-size="7" fill="#666666">• 0.0.98765: 500 tokens</text>
  <text x="100" y="132" font-family="Inter, sans-serif" font-size="7" fill="#666666">• 0.0.24680: 300 tokens</text>
  <text x="100" y="144" font-family="Inter, sans-serif" font-size="7" fill="#666666">• 0.0.13579: 200 tokens</text>
  <text x="100" y="150" font-family="Inter, sans-serif" font-size="6" fill="#0066FF">View on HashScan →</text>
  
  <!-- AI brain visualization -->
  <circle cx="40" cy="100" r="25" fill="#0066FF" fill-opacity="0.1"/>
  <path d="M 40 85 
           C 30 85, 25 95, 25 100 
           C 25 110, 35 115, 40 115 
           C 50 115, 55 105, 55 100 
           C 55 90, 45 85, 40 85" 
        stroke="#0066FF" stroke-width="1" fill="none"/>
  <path d="M 32 95 L 48 95" stroke="#0066FF" stroke-width="1"/>
  <path d="M 32 105 L 48 105" stroke="#0066FF" stroke-width="1"/>
  <path d="M 40 85 L 40 115" stroke="#0066FF" stroke-width="1"/>
  <circle cx="40" cy="100" r="20" stroke="#0066FF" stroke-width="1" fill="none">
    <animate attributeName="r" values="18;20;18" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Hedera connection visualization -->
  <circle cx="260" cy="100" r="25" fill="#0066FF" fill-opacity="0.1"/>
  <text x="260" y="90" font-family="Inter, sans-serif" font-size="8" fill="#0066FF" text-anchor="middle">Hedera</text>
  <text x="260" y="100" font-family="Inter, sans-serif" font-size="8" fill="#0066FF" text-anchor="middle">Network</text>
  <text x="260" y="115" font-family="Inter, sans-serif" font-size="12" fill="#0066FF" text-anchor="middle">ℏ</text>
  
  <!-- Connection lines -->
  <line x1="65" y1="100" x2="75" y2="100" stroke="#0066FF" stroke-width="1" stroke-dasharray="3 2">
    <animate attributeName="stroke-dashoffset" values="5;0" dur="1s" repeatCount="indefinite"/>
  </line>
  
  <line x1="225" y1="100" x2="235" y2="100" stroke="#0066FF" stroke-width="1" stroke-dasharray="3 2">
    <animate attributeName="stroke-dashoffset" values="5;0" dur="1s" repeatCount="indefinite"/>
  </line>
  
  <!-- Step indicator -->
  <circle cx="150" cy="180" r="10" fill="#0066FF" fill-opacity="0.2"/>
  <text x="150" y="184" font-family="Inter, sans-serif" font-size="12" fill="#0066FF" text-anchor="middle">3</text>
</svg>
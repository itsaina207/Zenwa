<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="250" viewBox="0 0 400 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="250" rx="20" fill="#F7F7F7"/>
  
  <!-- Telegram App with Unified Interface -->
  <rect x="100" y="25" width="200" height="200" rx="20" fill="white" stroke="#0088cc" stroke-width="3"/>
  
  <!-- Telegram Header -->
  <rect x="100" y="25" width="200" height="40" rx="20" fill="#0088cc"/>
  <text x="200" y="50" font-family="Inter, sans-serif" font-size="14" fill="white" text-anchor="middle">Zenwa Bot</text>
  <circle cx="125" cy="45" r="10" fill="white" fill-opacity="0.5"/>
  <text x="125" y="49" font-family="Inter, sans-serif" font-size="14" fill="white" text-anchor="middle">Z</text>
  
  <!-- Message Area -->
  <rect x="110" y="75" width="150" height="30" rx="15" fill="#e6efff"/>
  <text x="135" y="95" font-family="Inter, sans-serif" font-size="10" fill="#333333">What would you like to do?</text>
  
  <!-- Buttons for different actions -->
  <rect x="110" y="115" width="85" height="25" rx="12.5" fill="#0066FF"/>
  <text x="152.5" y="130" font-family="Inter, sans-serif" font-size="9" fill="white" text-anchor="middle">Check Balance</text>
  
  <rect x="205" y="115" width="85" height="25" rx="12.5" fill="#0066FF"/>
  <text x="247.5" y="130" font-family="Inter, sans-serif" font-size="9" fill="white" text-anchor="middle">Send HBAR</text>
  
  <rect x="110" y="150" width="85" height="25" rx="12.5" fill="#0066FF"/>
  <text x="152.5" y="165" font-family="Inter, sans-serif" font-size="9" fill="white" text-anchor="middle">Create Token</text>
  
  <rect x="205" y="150" width="85" height="25" rx="12.5" fill="#0066FF"/>
  <text x="247.5" y="165" font-family="Inter, sans-serif" font-size="9" fill="white" text-anchor="middle">Token Airdrop</text>
  
  <rect x="110" y="185" width="180" height="25" rx="12.5" fill="#0066FF"/>
  <text x="200" y="200" font-family="Inter, sans-serif" font-size="9" fill="white" text-anchor="middle">Ask Natural Language Question</text>
  
  <!-- Connected Devices -->
  <rect x="20" y="85" width="60" height="100" rx="10" fill="white" stroke="#DDDDDD" stroke-width="2"/>
  <rect x="30" y="100" width="40" height="5" rx="2.5" fill="#EAEAEA"/>
  <rect x="30" y="115" width="40" height="5" rx="2.5" fill="#EAEAEA"/>
  <rect x="30" y="130" width="40" height="40" rx="5" fill="#EAEAEA"/>
  
  <rect x="320" y="85" width="60" height="100" rx="10" fill="white" stroke="#DDDDDD" stroke-width="2"/>
  <rect x="330" y="100" width="40" height="5" rx="2.5" fill="#EAEAEA"/>
  <rect x="330" y="115" width="40" height="5" rx="2.5" fill="#EAEAEA"/>
  <rect x="330" y="130" width="40" height="40" rx="5" fill="#EAEAEA"/>
  
  <!-- Connectors showing unified experience -->
  <line x1="80" y1="135" x2="100" y2="135" stroke="#0066FF" stroke-width="2"/>
  <circle cx="90" cy="135" r="5" fill="#0066FF"/>
  
  <line x1="300" y1="135" x2="320" y2="135" stroke="#0066FF" stroke-width="2"/>
  <circle cx="310" cy="135" r="5" fill="#0066FF"/>
  
  <!-- Happy User -->
  <circle cx="200" cy="230" r="10" fill="#7CED7C"/>
  <text x="200" y="234" font-family="Inter, sans-serif" font-size="12" fill="white" text-anchor="middle">✓</text>
  
  <!-- Solution Success Markers -->
  <circle cx="50" cy="70" r="8" fill="#7CED7C"/>
  <text x="50" y="74" font-family="Inter, sans-serif" font-size="10" fill="white" text-anchor="middle">✓</text>
  
  <circle cx="350" cy="70" r="8" fill="#7CED7C"/>
  <text x="350" y="74" font-family="Inter, sans-serif" font-size="10" fill="white" text-anchor="middle">✓</text>
  
  <circle cx="50" cy="200" r="8" fill="#7CED7C"/>
  <text x="50" y="204" font-family="Inter, sans-serif" font-size="10" fill="white" text-anchor="middle">✓</text>
  
  <circle cx="350" cy="200" r="8" fill="#7CED7C"/>
  <text x="350" y="204" font-family="Inter, sans-serif" font-size="10" fill="white" text-anchor="middle">✓</text>
</svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="800" viewBox="0 0 600 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with subtle gradient -->
  <defs>
    <linearGradient id="bg_gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#001F42" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <rect width="600" height="800" fill="url(#bg_gradient)"/>
  
  <!-- Smartphone outline - iPhone ratio ~2:1 -->
  <rect x="200" y="100" width="200" height="440" rx="30" fill="#ffffff" filter="url(#shadow)" stroke="#0066FF" stroke-width="10"/>
  <rect x="206" y="130" width="188" height="380" rx="3" fill="#f5f8ff"/>
  
  <!-- Telegram header -->
  <rect x="206" y="130" width="188" height="45" rx="3" fill="#0088cc"/>
  <text x="300" y="160" font-family="Inter, sans-serif" font-size="22" fill="white" text-anchor="middle">Zenwa Bot</text>
  <circle cx="370" y="152" r="10" fill="white" fill-opacity="0.5"/>
  <path d="M375 147L365 157M365 147L375 157" stroke="white" stroke-width="2"/>
  
  <!-- Messages area -->
  <!-- Bot message 1 -->
  <rect x="216" y="185" width="168" height="60" rx="15" fill="#e6efff"/>
  <text x="230" y="210" font-family="Inter, sans-serif" font-size="14" fill="#333333">Welcome to Zenwa! Your Hedera</text>
  <text x="230" y="230" font-family="Inter, sans-serif" font-size="14" fill="#333333">wallet is ready. What would you like?</text>
  
  <!-- User message -->
  <rect x="264" y="255" width="120" height="30" rx="15" fill="#0066FF"/>
  <text x="324" y="275" font-family="Inter, sans-serif" font-size="14" fill="white" text-anchor="middle">Check balance</text>
  
  <!-- Bot message 2 -->
  <rect x="216" y="295" width="168" height="75" rx="15" fill="#e6efff"/>
  <text x="230" y="315" font-family="Inter, sans-serif" font-size="14" fill="#333333">Your balance:</text>
  <text x="230" y="345" font-family="Inter, sans-serif" font-size="20" font-weight="bold" fill="#0066FF">500 ℏ</text>
  <text x="230" y="365" font-family="Inter, sans-serif" font-size="12" fill="#666666">1000 TOKEN (0.0.12345)</text>
  
  <!-- Bot message 3 with buttons -->
  <rect x="216" y="380" width="168" height="90" rx="15" fill="#e6efff"/>
  <text x="230" y="400" font-family="Inter, sans-serif" font-size="14" fill="#333333">What would you like to do next?</text>
  
  <!-- Button grid - 2x2 -->
  <rect x="225" y="410" width="70" height="25" rx="12.5" fill="#0066FF"/>
  <text x="260" y="426" font-family="Inter, sans-serif" font-size="11" fill="white" text-anchor="middle">Send HBAR</text>
  
  <rect x="305" y="410" width="70" height="25" rx="12.5" fill="#0066FF"/>
  <text x="340" y="426" font-family="Inter, sans-serif" font-size="11" fill="white" text-anchor="middle">Send Token</text>
  
  <rect x="225" y="440" width="70" height="25" rx="12.5" fill="#0066FF"/>
  <text x="260" y="456" font-family="Inter, sans-serif" font-size="11" fill="white" text-anchor="middle">Create Token</text>
  
  <rect x="305" y="440" width="70" height="25" rx="12.5" fill="#0066FF"/>
  <text x="340" y="456" font-family="Inter, sans-serif" font-size="11" fill="white" text-anchor="middle">Airdrop</text>
  
  <!-- Message input area -->
  <rect x="206" y="480" width="188" height="30" rx="15" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="230" y="500" font-family="Inter, sans-serif" font-size="11" fill="#999999">Type a message...</text>
  <circle cx="370" y="495" r="12" fill="#0066FF"/>
  <path d="M365 495L370 500L375 495" stroke="white" stroke-width="2"/>
  
  <!-- Floating icon bubbles -->
  <g opacity="0.8">
    <circle cx="120" y="200" r="30" fill="#0066FF" fill-opacity="0.15"/>
    <text x="120" y="208" font-family="Inter, sans-serif" font-size="20" font-weight="bold" fill="#0066FF" text-anchor="middle">ℏ</text>
    
    <circle cx="480" y="180" r="30" fill="#0066FF" fill-opacity="0.15"/>
    <text x="480" y="188" font-family="Inter, sans-serif" font-size="20" font-weight="bold" fill="#0066FF" text-anchor="middle">₮</text>
    
    <circle cx="100" y="350" r="40" fill="#0066FF" fill-opacity="0.15"/>
    <text x="100" y="358" font-family="Inter, sans-serif" font-size="24" font-weight="bold" fill="#0066FF" text-anchor="middle">🚀</text>
    
    <circle cx="500" y="400" r="40" fill="#0066FF" fill-opacity="0.15"/>
    <text x="500" y="408" font-family="Inter, sans-serif" font-size="24" font-weight="bold" fill="#0066FF" text-anchor="middle">🔗</text>
  </g>
  
  <!-- Light effect -->
  <circle cx="300" cy="600" r="150" fill="#0066FF" fill-opacity="0.05"/>
</svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="250" viewBox="0 0 400 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="250" rx="20" fill="#F7F7F7"/>
  
  <!-- Multiple disconnected screens/devices -->
  <rect x="30" y="50" width="100" height="150" rx="10" fill="white" stroke="#CCCCCC" stroke-width="2"/>
  <rect x="40" y="70" width="80" height="15" rx="3" fill="#EAEAEA"/>
  <rect x="40" y="95" width="80" height="10" rx="2" fill="#EAEAEA"/>
  <rect x="40" y="115" width="40" height="10" rx="2" fill="#EAEAEA"/>
  <rect x="40" y="135" width="80" height="40" rx="5" fill="#EAEAEA"/>
  <text x="80" y="190" font-family="Inter, sans-serif" font-size="10" fill="#999999" text-anchor="middle">Desktop Wallet</text>
  
  <rect x="150" y="30" width="90" height="160" rx="10" fill="white" stroke="#CCCCCC" stroke-width="2"/>
  <rect x="155" y="40" width="80" height="10" rx="2" fill="#EAEAEA"/>
  <rect x="155" y="60" width="80" height="80" rx="5" fill="#EAEAEA"/>
  <rect x="155" y="150" width="40" height="10" rx="2" fill="#EAEAEA"/>
  <rect x="155" y="170" width="80" height="10" rx="2" fill="#EAEAEA"/>
  <text x="195" y="200" font-family="Inter, sans-serif" font-size="10" fill="#999999" text-anchor="middle">Mobile Wallet</text>
  
  <rect x="260" y="70" width="110" height="120" rx="10" fill="white" stroke="#CCCCCC" stroke-width="2"/>
  <rect x="270" y="85" width="90" height="15" rx="3" fill="#EAEAEA"/>
  <rect x="270" y="110" width="90" height="10" rx="2" fill="#EAEAEA"/>
  <rect x="270" y="130" width="90" height="10" rx="2" fill="#EAEAEA"/>
  <rect x="270" y="150" width="90" height="10" rx="2" fill="#EAEAEA"/>
  <text x="315" y="200" font-family="Inter, sans-serif" font-size="10" fill="#999999" text-anchor="middle">Web App</text>
  
  <!-- Confused user symbol -->
  <circle cx="200" cy="120" r="30" fill="#FFDDDD"/>
  <text x="200" y="128" font-family="Inter, sans-serif" font-size="20" fill="#FF5555" text-anchor="middle">?</text>
  
  <!-- Connection issues -->
  <line x1="70" y1="80" x2="160" y2="100" stroke="#FF5555" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="160" y1="100" x2="270" y2="100" stroke="#FF5555" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="270" y1="100" x2="80" y2="140" stroke="#FF5555" stroke-width="2" stroke-dasharray="5 5"/>
  
  <!-- Complexity symbols -->
  <circle cx="50" cy="40" r="10" fill="#FFD166"/>
  <text x="50" y="44" font-family="Inter, sans-serif" font-size="12" fill="white" text-anchor="middle">!</text>
  
  <circle cx="350" cy="50" r="10" fill="#FFD166"/>
  <text x="350" y="54" font-family="Inter, sans-serif" font-size="12" fill="white" text-anchor="middle">!</text>
  
  <circle cx="120" cy="210" r="10" fill="#FFD166"/>
  <text x="120" y="214" font-family="Inter, sans-serif" font-size="12" fill="white" text-anchor="middle">!</text>
  
  <circle cx="280" cy="220" r="10" fill="#FFD166"/>
  <text x="280" y="224" font-family="Inter, sans-serif" font-size="12" fill="white" text-anchor="middle">!</text>
</svg>
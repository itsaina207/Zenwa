<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="600" viewBox="0 0 400 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with subtle gradient -->
  <defs>
    <linearGradient id="bg_gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#001F42" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <rect width="400" height="600" fill="url(#bg_gradient)"/>
  
  <!-- Smartphone outline -->
  <rect x="115" y="50" width="170" height="350" rx="25" fill="#ffffff" filter="url(#shadow)" stroke="#0066FF" stroke-width="4"/>
  <rect x="118" y="75" width="164" height="300" rx="2" fill="#f5f8ff"/>
  
  <!-- Telegram header -->
  <rect x="118" y="75" width="164" height="30" rx="2" fill="#0088cc"/>
  <text x="195" y="96" font-family="Inter, sans-serif" font-size="14" fill="white" text-anchor="middle">Zenwa Bot</text>
  <circle cx="270" cy="90" r="8" fill="white" fill-opacity="0.5"/>
  <path d="M274 86L266 94M266 86L274 94" stroke="white" stroke-width="1.5"/>
  
  <!-- Messages area -->
  <!-- Bot message 1 -->
  <rect x="125" y="115" width="150" height="40" rx="10" fill="#e6efff"/>
  <text x="134" y="130" font-family="Inter, sans-serif" font-size="9" fill="#333333">Welcome to Zenwa! Your Hedera</text>
  <text x="134" y="145" font-family="Inter, sans-serif" font-size="9" fill="#333333">wallet is ready. What would you like to do?</text>
  
  <!-- User message -->
  <rect x="180" y="165" width="95" height="24" rx="12" fill="#0066FF"/>
  <text x="195" y="180" font-family="Inter, sans-serif" font-size="10" fill="white" text-anchor="middle">Check balance</text>
  
  <!-- Bot message 2 -->
  <rect x="125" y="200" width="150" height="55" rx="10" fill="#e6efff"/>
  <text x="134" y="215" font-family="Inter, sans-serif" font-size="9" fill="#333333">Your balance:</text>
  <text x="134" y="235" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#0066FF">500 ℏ</text>
  <text x="134" y="250" font-family="Inter, sans-serif" font-size="9" fill="#666666">1000 TOKEN (0.0.12345)</text>
  
  <!-- Bot message 3 with buttons -->
  <rect x="125" y="265" width="150" height="75" rx="10" fill="#e6efff"/>
  <text x="134" y="280" font-family="Inter, sans-serif" font-size="9" fill="#333333">What would you like to do next?</text>
  
  <!-- Button row 1 -->
  <rect x="134" y="290" width="65" height="20" rx="10" fill="#0066FF"/>
  <text x="166.5" y="303" font-family="Inter, sans-serif" font-size="8" fill="white" text-anchor="middle">Send HBAR</text>
  
  <rect x="203" y="290" width="65" height="20" rx="10" fill="#0066FF"/>
  <text x="235.5" y="303" font-family="Inter, sans-serif" font-size="8" fill="white" text-anchor="middle">Send Token</text>
  
  <!-- Button row 2 -->
  <rect x="134" y="315" width="65" height="20" rx="10" fill="#0066FF"/>
  <text x="166.5" y="328" font-family="Inter, sans-serif" font-size="8" fill="white" text-anchor="middle">Create Token</text>
  
  <rect x="203" y="315" width="65" height="20" rx="10" fill="#0066FF"/>
  <text x="235.5" y="328" font-family="Inter, sans-serif" font-size="8" fill="white" text-anchor="middle">Airdrop</text>
  
  <!-- Message input area -->
  <rect x="118" y="375" width="164" height="25" rx="12.5" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="140" y="391" font-family="Inter, sans-serif" font-size="9" fill="#999999">Type a message...</text>
  <circle cx="265" cy="387.5" r="10" fill="#0066FF"/>
  <path d="M261 387.5L265 391.5L269 387.5" stroke="white" stroke-width="1.5"/>
  
  <!-- Floating icon bubbles -->
  <g opacity="0.8">
    <circle cx="75" cy="150" r="20" fill="#0066FF" fill-opacity="0.15"/>
    <text x="75" y="154" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#0066FF" text-anchor="middle">ℏ</text>
    
    <circle cx="325" cy="130" r="20" fill="#0066FF" fill-opacity="0.15"/>
    <text x="325" y="134" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#0066FF" text-anchor="middle">₮</text>
    
    <circle cx="60" cy="250" r="25" fill="#0066FF" fill-opacity="0.15"/>
    <text x="60" y="255" font-family="Inter, sans-serif" font-size="16" font-weight="bold" fill="#0066FF" text-anchor="middle">🚀</text>
    
    <circle cx="335" cy="280" r="25" fill="#0066FF" fill-opacity="0.15"/>
    <text x="335" y="285" font-family="Inter, sans-serif" font-size="16" font-weight="bold" fill="#0066FF" text-anchor="middle">🔗</text>
  </g>
  
  <!-- Light effect -->
  <circle cx="200" cy="450" r="100" fill="#0066FF" fill-opacity="0.05"/>
</svg>
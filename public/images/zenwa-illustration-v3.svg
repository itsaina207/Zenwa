<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="800" viewBox="0 0 500 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with subtle gradient -->
  <defs>
    <linearGradient id="bg_gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#001F42" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <rect width="500" height="800" fill="url(#bg_gradient)"/>
  
  <!-- Smartphone outline -->
  <rect x="150" y="50" width="200" height="600" rx="25" fill="#ffffff" filter="url(#shadow)" stroke="#0066FF" stroke-width="10"/>
  <rect x="155" y="80" width="190" height="540" rx="2" fill="#f5f8ff"/>
  
  <!-- Telegram header -->
  <rect x="155" y="80" width="190" height="50" rx="2" fill="#0088cc"/>
  <text x="250" y="112" font-family="Inter, sans-serif" font-size="22" fill="white" text-anchor="middle">Zenwa Bot</text>
  <circle cx="325" y="105" r="10" fill="white" fill-opacity="0.5"/>
  <path d="M330 100L320 110M320 100L330 110" stroke="white" stroke-width="2"/>
  
  <!-- Messages area -->
  <!-- Bot message 1 -->
  <rect x="165" y="145" width="170" height="55" rx="15" fill="#e6efff"/>
  <text x="175" y="165" font-family="Inter, sans-serif" font-size="12" fill="#333333">Welcome to Zenwa! Your Hedera</text>
  <text x="175" y="185" font-family="Inter, sans-serif" font-size="12" fill="#333333">wallet is ready. What would you like to do?</text>
  
  <!-- User message -->
  <rect x="215" y="215" width="120" height="30" rx="15" fill="#0066FF"/>
  <text x="275" y="234" font-family="Inter, sans-serif" font-size="12" fill="white" text-anchor="middle">Check balance</text>
  
  <!-- Bot message 2 -->
  <rect x="165" y="260" width="170" height="75" rx="15" fill="#e6efff"/>
  <text x="175" y="280" font-family="Inter, sans-serif" font-size="12" fill="#333333">Your balance:</text>
  <text x="175" y="305" font-family="Inter, sans-serif" font-size="16" font-weight="bold" fill="#0066FF">500 ℏ</text>
  <text x="175" y="325" font-family="Inter, sans-serif" font-size="12" fill="#666666">1000 TOKEN (0.0.12345)</text>
  
  <!-- Bot message 3 with buttons -->
  <rect x="165" y="350" width="170" height="105" rx="15" fill="#e6efff"/>
  <text x="175" y="370" font-family="Inter, sans-serif" font-size="12" fill="#333333">What would you like to do next?</text>
  
  <!-- Button row 1 -->
  <rect x="175" y="385" width="70" height="25" rx="12.5" fill="#0066FF"/>
  <text x="210" y="401" font-family="Inter, sans-serif" font-size="10" fill="white" text-anchor="middle">Send HBAR</text>
  
  <rect x="255" y="385" width="70" height="25" rx="12.5" fill="#0066FF"/>
  <text x="290" y="401" font-family="Inter, sans-serif" font-size="10" fill="white" text-anchor="middle">Send Token</text>
  
  <!-- Button row 2 -->
  <rect x="175" y="420" width="70" height="25" rx="12.5" fill="#0066FF"/>
  <text x="210" y="436" font-family="Inter, sans-serif" font-size="10" fill="white" text-anchor="middle">Create Token</text>
  
  <rect x="255" y="420" width="70" height="25" rx="12.5" fill="#0066FF"/>
  <text x="290" y="436" font-family="Inter, sans-serif" font-size="10" fill="white" text-anchor="middle">Airdrop</text>
  
  <!-- Message input area -->
  <rect x="155" y="620" width="190" height="40" rx="20" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="185" y="645" font-family="Inter, sans-serif" font-size="12" fill="#999999">Type a message...</text>
  <circle cx="325" cy="640" r="15" fill="#0066FF"/>
  <path d="M320 640L325 645L330 640" stroke="white" stroke-width="2"/>
  
  <!-- Floating icon bubbles -->
  <g opacity="0.8">
    <circle cx="100" cy="200" r="25" fill="#0066FF" fill-opacity="0.15"/>
    <text x="100" y="205" font-family="Inter, sans-serif" font-size="16" font-weight="bold" fill="#0066FF" text-anchor="middle">ℏ</text>
    
    <circle cx="400" cy="180" r="25" fill="#0066FF" fill-opacity="0.15"/>
    <text x="400" y="185" font-family="Inter, sans-serif" font-size="16" font-weight="bold" fill="#0066FF" text-anchor="middle">₮</text>
    
    <circle cx="90" cy="350" r="30" fill="#0066FF" fill-opacity="0.15"/>
    <text x="90" y="356" font-family="Inter, sans-serif" font-size="18" font-weight="bold" fill="#0066FF" text-anchor="middle">🚀</text>
    
    <circle cx="410" cy="400" r="30" fill="#0066FF" fill-opacity="0.15"/>
    <text x="410" y="406" font-family="Inter, sans-serif" font-size="18" font-weight="bold" fill="#0066FF" text-anchor="middle">🔗</text>
  </g>
  
  <!-- Light effect -->
  <circle cx="250" cy="700" r="100" fill="#0066FF" fill-opacity="0.05"/>
</svg>
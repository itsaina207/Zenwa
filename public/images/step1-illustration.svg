<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="200" viewBox="0 0 300 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with subtle grid -->
  <rect width="300" height="200" rx="15" fill="#F7F7F7"/>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E0E0E0" stroke-width="0.5"/>
  </pattern>
  <rect width="300" height="200" fill="url(#grid)"/>
  
  <!-- Smartphone outline -->
  <rect x="100" y="20" width="100" height="160" rx="15" fill="white" stroke="#0066FF" stroke-width="2"/>
  <rect x="110" y="35" width="80" height="130" rx="5" fill="#F0F7FF"/>
  
  <!-- Telegram header -->
  <rect x="110" y="35" width="80" height="20" rx="5" fill="#0088cc"/>
  <text x="150" y="50" font-family="Inter, sans-serif" font-size="10" fill="white" text-anchor="middle">Zenwa Bot</text>
  
  <!-- Start command message -->
  <rect x="115" y="65" width="70" height="20" rx="10" fill="#e6efff"/>
  <text x="150" y="79" font-family="monospace" font-size="10" fill="#0066FF" text-anchor="middle">/start</text>
  
  <!-- Response to start -->
  <rect x="115" y="95" width="70" height="30" rx="10" fill="#0066FF" fill-opacity="0.1"/>
  <text x="150" y="110" font-family="Inter, sans-serif" font-size="8" fill="#333333" text-anchor="middle">Welcome to Zenwa!</text>
  <text x="150" y="120" font-family="Inter, sans-serif" font-size="8" fill="#666666" text-anchor="middle">Type /createwallet</text>
  
  <!-- Create wallet command -->
  <rect x="115" y="135" width="70" height="20" rx="10" fill="#e6efff"/>
  <text x="150" y="149" font-family="monospace" font-size="9" fill="#0066FF" text-anchor="middle">/createwallet</text>
  
  <!-- Animation elements -->
  <circle cx="50" cy="100" r="25" fill="#0066FF" fill-opacity="0.1">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="50" y="104" font-family="Inter, sans-serif" font-size="12" fill="#0066FF" text-anchor="middle">Step 1</text>

  <circle cx="250" cy="100" r="25" fill="#0066FF" fill-opacity="0.1">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="250" y="104" font-family="Inter, sans-serif" font-size="20" fill="#0066FF" text-anchor="middle">1</text>
  
  <!-- Flowing lines indicating process -->
  <path d="M75 100 C 85 100, 95 100, 100 100" stroke="#0066FF" stroke-width="2" stroke-dasharray="2 2">
    <animate attributeName="stroke-dashoffset" values="6;0" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <path d="M200 100 C 210 100, 220 100, 225 100" stroke="#0066FF" stroke-width="2" stroke-dasharray="2 2">
    <animate attributeName="stroke-dashoffset" values="6;0" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Account creation success indicator -->
  <circle cx="150" cy="175" r="10" fill="#7CED7C" fill-opacity="0.3">
    <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="150" y="179" font-family="Inter, sans-serif" font-size="10" fill="#7CED7C" text-anchor="middle">✓</text>
</svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="800" viewBox="0 0 500 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with subtle gradient -->
  <defs>
    <linearGradient id="bg_gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#001F42" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <rect width="500" height="800" fill="url(#bg_gradient)"/>
  
  <!-- Smartphone outline - iPhone ratio ~2:1 -->
  <rect x="165" y="100" width="170" height="350" rx="25" fill="#ffffff" filter="url(#shadow)" stroke="#0066FF" stroke-width="8"/>
  <rect x="170" y="125" width="160" height="300" rx="2" fill="#f5f8ff"/>
  
  <!-- Telegram header -->
  <rect x="170" y="125" width="160" height="40" rx="2" fill="#0088cc"/>
  <text x="250" y="150" font-family="Inter, sans-serif" font-size="18" fill="white" text-anchor="middle">Zenwa Bot</text>
  <circle cx="310" y="145" r="8" fill="white" fill-opacity="0.5"/>
  <path d="M315 140L305 150M305 140L315 150" stroke="white" stroke-width="1.5"/>
  
  <!-- Messages area -->
  <!-- Bot message 1 -->
  <rect x="180" y="175" width="140" height="45" rx="15" fill="#e6efff"/>
  <text x="190" y="195" font-family="Inter, sans-serif" font-size="11" fill="#333333">Welcome to Zenwa! Your Hedera</text>
  <text x="190" y="210" font-family="Inter, sans-serif" font-size="11" fill="#333333">wallet is ready. What would you like?</text>
  
  <!-- User message -->
  <rect x="220" y="230" width="100" height="25" rx="12.5" fill="#0066FF"/>
  <text x="270" y="245" font-family="Inter, sans-serif" font-size="10" fill="white" text-anchor="middle">Check balance</text>
  
  <!-- Bot message 2 -->
  <rect x="180" y="265" width="140" height="60" rx="15" fill="#e6efff"/>
  <text x="190" y="280" font-family="Inter, sans-serif" font-size="11" fill="#333333">Your balance:</text>
  <text x="190" y="300" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#0066FF">500 ℏ</text>
  <text x="190" y="315" font-family="Inter, sans-serif" font-size="11" fill="#666666">1000 TOKEN (0.0.12345)</text>
  
  <!-- Bot message 3 with buttons -->
  <rect x="180" y="335" width="140" height="80" rx="15" fill="#e6efff"/>
  <text x="190" y="350" font-family="Inter, sans-serif" font-size="11" fill="#333333">What would you like to do next?</text>
  
  <!-- Button grid - 2x2 -->
  <rect x="190" y="365" width="55" height="20" rx="10" fill="#0066FF"/>
  <text x="217.5" y="378" font-family="Inter, sans-serif" font-size="8" fill="white" text-anchor="middle">Send HBAR</text>
  
  <rect x="255" y="365" width="55" height="20" rx="10" fill="#0066FF"/>
  <text x="282.5" y="378" font-family="Inter, sans-serif" font-size="8" fill="white" text-anchor="middle">Send Token</text>
  
  <rect x="190" y="390" width="55" height="20" rx="10" fill="#0066FF"/>
  <text x="217.5" y="403" font-family="Inter, sans-serif" font-size="8" fill="white" text-anchor="middle">Create Token</text>
  
  <rect x="255" y="390" width="55" height="20" rx="10" fill="#0066FF"/>
  <text x="282.5" y="403" font-family="Inter, sans-serif" font-size="8" fill="white" text-anchor="middle">Airdrop</text>
  
  <!-- Message input area -->
  <rect x="170" y="425" width="160" height="25" rx="12.5" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="185" y="441" font-family="Inter, sans-serif" font-size="9" fill="#999999">Type a message...</text>
  <circle cx="315" y="437.5" r="10" fill="#0066FF"/>
  <path d="M310 437.5L315 442.5L320 437.5" stroke="white" stroke-width="1.5"/>
  
  <!-- Floating icon bubbles -->
  <g opacity="0.8">
    <circle cx="120" cy="200" r="20" fill="#0066FF" fill-opacity="0.15"/>
    <text x="120" y="205" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#0066FF" text-anchor="middle">ℏ</text>
    
    <circle cx="380" cy="180" r="20" fill="#0066FF" fill-opacity="0.15"/>
    <text x="380" y="185" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#0066FF" text-anchor="middle">₮</text>
    
    <circle cx="100" cy="320" r="25" fill="#0066FF" fill-opacity="0.15"/>
    <text x="100" y="326" font-family="Inter, sans-serif" font-size="16" font-weight="bold" fill="#0066FF" text-anchor="middle">🚀</text>
    
    <circle cx="390" cy="350" r="25" fill="#0066FF" fill-opacity="0.15"/>
    <text x="390" y="356" font-family="Inter, sans-serif" font-size="16" font-weight="bold" fill="#0066FF" text-anchor="middle">🔗</text>
  </g>
  
  <!-- Light effect -->
  <circle cx="250" cy="600" r="100" fill="#0066FF" fill-opacity="0.05"/>
</svg>